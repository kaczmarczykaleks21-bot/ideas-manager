<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" width="480" height="360">
  <defs>
    <filter id="wood-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="chalk-blur">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Drewniana rama -->
  <rect x="12" y="12" width="456" height="336" rx="14" fill="#5c3d1a" filter="url(#wood-shadow)"/>
  <!-- Wewnętrzna rama — ciemniejsza -->
  <rect x="20" y="20" width="440" height="320" rx="10" fill="#4a3015"/>
  <!-- Tablica — ciemna zieleń -->
  <rect x="28" y="28" width="424" height="296" rx="7" fill="#1e3a2e"/>
  <!-- Subtelny połysk tablicy -->
  <rect x="28" y="28" width="424" height="296" rx="7" fill="url(#board-shine)" opacity="0.04"/>
  <!-- Delikatna tekstura tablicy -->
  <rect x="28" y="28" width="424" height="296" rx="7" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Listewka na dole -->
  <rect x="20" y="322" width="440" height="18" rx="0 0 10 10" fill="#7a5230"/>
  <rect x="20" y="322" width="440" height="4" fill="#8a6240" opacity="0.6"/>
  <!-- Kredki na listewce -->
  <rect x="60" y="325" width="28" height="8" rx="3" fill="rgba(255,255,255,0.18)"/>
  <rect x="96" y="326" width="18" height="7" rx="3" fill="rgba(255,220,180,0.25)"/>
  <!-- Gumka -->
  <rect x="390" y="324" width="36" height="10" rx="3" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <rect x="392" y="326" width="32" height="6" rx="2" fill="rgba(255,255,255,0.07)"/>

  <!-- Tytuł tablicy -->
  <text x="48" y="58" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="10" fill="rgba(232,245,224,0.38)" letter-spacing="1.8" text-anchor="start" font-weight="400">MOJA TABLICA POMYSŁÓW</text>

  <!-- Linia separatora pod tytułem -->
  <line x1="48" y1="66" x2="432" y2="66" stroke="rgba(232,245,224,0.08)" stroke-width="0.5"/>

  <!-- === KOLUMNA 1: Do rozwinięcia === -->
  <!-- Nagłówek kolumny -->
  <text x="48" y="90" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9" fill="rgba(232,245,224,0.32)" letter-spacing="1.2" font-weight="500">DO ROZWINIĘCIA</text>
  <line x1="48" y1="96" x2="178" y2="96" stroke="rgba(232,245,224,0.1)" stroke-width="0.5"/>

  <!-- Karta 1.1 -->
  <rect x="48" y="104" width="130" height="52" rx="5" fill="rgba(232,245,224,0.07)" stroke="rgba(232,245,224,0.14)" stroke-width="0.5"/>
  <circle cx="60" cy="116" r="3.5" fill="rgba(232,245,224,0.35)"/>
  <text x="70" y="119" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9.5" fill="rgba(232,245,224,0.72)" font-weight="400">AI auto-tagowanie</text>
  <text x="60" y="133" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8.5" fill="rgba(232,245,224,0.42)">przy wpisie nowej notatki</text>
  <text x="60" y="147" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(232,245,224,0.25)">Produkt · 2 dni temu</text>

  <!-- Karta 1.2 -->
  <rect x="48" y="164" width="130" height="52" rx="5" fill="rgba(232,245,224,0.07)" stroke="rgba(232,245,224,0.14)" stroke-width="0.5"/>
  <circle cx="60" cy="176" r="3.5" fill="rgba(232,245,224,0.35)"/>
  <text x="70" y="179" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9.5" fill="rgba(232,245,224,0.72)">Graph view pomysłów</text>
  <text x="60" y="193" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8.5" fill="rgba(232,245,224,0.42)">interaktywny kanvas relacji</text>
  <text x="60" y="207" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(232,245,224,0.25)">Produkt · wczoraj</text>

  <!-- Karta 1.3 -->
  <rect x="48" y="224" width="130" height="52" rx="5" fill="rgba(232,245,224,0.07)" stroke="rgba(232,245,224,0.14)" stroke-width="0.5"/>
  <circle cx="60" cy="236" r="3.5" fill="rgba(232,245,224,0.35)"/>
  <text x="70" y="239" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9.5" fill="rgba(232,245,224,0.72)">Podcast o kreatywności</text>
  <text x="60" y="253" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8.5" fill="rgba(232,245,224,0.42)">format 30 min, wywiady</text>
  <text x="60" y="267" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(232,245,224,0.25)">Osobiste · 4 dni temu</text>

  <!-- Dodaj kartę 1 -->
  <rect x="48" y="284" width="130" height="28" rx="5" fill="none" stroke="rgba(232,245,224,0.13)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="113" y="302" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="18" fill="rgba(232,245,224,0.2)" text-anchor="middle" font-weight="300">+</text>

  <!-- Separator kolumn -->
  <line x1="194" y1="74" x2="194" y2="308" stroke="rgba(232,245,224,0.07)" stroke-width="0.5"/>

  <!-- === KOLUMNA 2: W trakcie === -->
  <text x="204" y="90" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9" fill="rgba(255,200,140,0.45)" letter-spacing="1.2" font-weight="500">W TRAKCIE</text>
  <line x1="204" y1="96" x2="334" y2="96" stroke="rgba(255,200,140,0.12)" stroke-width="0.5"/>

  <!-- Karta 2.1 -->
  <rect x="204" y="104" width="130" height="52" rx="5" fill="rgba(255,220,180,0.07)" stroke="rgba(255,200,140,0.18)" stroke-width="0.5"/>
  <circle cx="216" cy="116" r="3.5" fill="rgba(255,200,140,0.45)"/>
  <text x="226" y="119" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9.5" fill="rgba(255,220,180,0.78)">Weekly digest email</text>
  <text x="216" y="133" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8.5" fill="rgba(255,220,180,0.42)">co piątek — porzucone idee</text>
  <text x="216" y="147" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(255,220,180,0.25)">Marketing · dziś</text>

  <!-- Karta 2.2 -->
  <rect x="204" y="164" width="130" height="52" rx="5" fill="rgba(255,220,180,0.07)" stroke="rgba(255,200,140,0.18)" stroke-width="0.5"/>
  <circle cx="216" cy="176" r="3.5" fill="rgba(255,200,140,0.45)"/>
  <text x="226" y="179" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9.5" fill="rgba(255,220,180,0.78)">Integracja z Notion</text>
  <text x="216" y="193" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8.5" fill="rgba(255,220,180,0.42)">dwukierunkowa synchronizacja</text>
  <text x="216" y="207" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(255,220,180,0.25)">Produkt · 3 dni temu</text>

  <!-- Dodaj kartę 2 -->
  <rect x="204" y="224" width="130" height="28" rx="5" fill="none" stroke="rgba(255,200,140,0.1)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="269" y="242" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="18" fill="rgba(255,200,140,0.18)" text-anchor="middle" font-weight="300">+</text>

  <!-- Separator kolumn -->
  <line x1="350" y1="74" x2="350" y2="308" stroke="rgba(232,245,224,0.07)" stroke-width="0.5"/>

  <!-- === KOLUMNA 3: Zrobione === -->
  <text x="360" y="90" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9" fill="rgba(160,200,255,0.4)" letter-spacing="1.2" font-weight="500">ZROBIONE</text>
  <line x1="360" y1="96" x2="432" y2="96" stroke="rgba(160,200,255,0.1)" stroke-width="0.5"/>

  <!-- Karta 3.1 -->
  <rect x="360" y="104" width="72" height="52" rx="5" fill="rgba(180,220,255,0.07)" stroke="rgba(160,200,255,0.16)" stroke-width="0.5"/>
  <circle cx="370" cy="116" r="3.5" fill="rgba(160,200,255,0.4)"/>
  <text x="360" y="134" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9" fill="rgba(180,220,255,0.72)" text-anchor="middle" transform="translate(36,0)">Skrót ⌘K</text>
  <text x="360" y="148" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(180,220,255,0.28)" text-anchor="middle" transform="translate(36,0)">do zapisu</text>

  <!-- Karta 3.2 -->
  <rect x="360" y="164" width="72" height="52" rx="5" fill="rgba(180,220,255,0.07)" stroke="rgba(160,200,255,0.16)" stroke-width="0.5"/>
  <circle cx="370" cy="176" r="3.5" fill="rgba(160,200,255,0.4)"/>
  <text x="360" y="194" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="9" fill="rgba(180,220,255,0.72)" text-anchor="middle" transform="translate(36,0)">Onboarding</text>
  <text x="360" y="208" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="8" fill="rgba(180,220,255,0.28)" text-anchor="middle" transform="translate(36,0)">bez tutorialu</text>

  <!-- Dodaj kartę 3 -->
  <rect x="360" y="224" width="72" height="28" rx="5" fill="none" stroke="rgba(160,200,255,0.1)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="396" y="242" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="18" fill="rgba(160,200,255,0.16)" text-anchor="middle" font-weight="300">+</text>

  <!-- Dekoracyjne ślady kredy w tle (bardzo subtelne) -->
  <line x1="80" y1="290" x2="160" y2="288" stroke="rgba(232,245,224,0.03)" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="270" x2="290" y2="272" stroke="rgba(255,200,140,0.03)" stroke-width="2" stroke-linecap="round"/>
</svg>
